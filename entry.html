<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3d6ab">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>パン食い競争 出場申込｜パンパク</title>
<meta name="description" content="パン食い競争の出場申込ページ。現在準備中です。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3d6ab;--ink:#2b2a4a;--sub:#6b5a48;--accent:#d4503f;--blue:#2f5d9e;--green:#0a9a54;--card:#fffaf0;--line:#e3c18f}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.8}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{background:var(--bg);color:var(--ink);text-align:center;padding:28px 16px 8px;border-bottom:6px solid var(--blue)}
.logo{display:block;width:120px;height:120px;border-radius:50%;margin:0 auto 12px}
.chars{display:block;width:78%;max-width:320px;margin:12px auto 0}
.stripe{height:14px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,var(--blue) 28px 56px,var(--green) 56px 84px)}
header .date{display:inline-block;background:var(--blue);color:#fff;font-weight:700;border-radius:999px;padding:2px 16px;font-size:14px}
h1{font-size:40px;line-height:1.3;margin:12px 0 8px;color:var(--accent);font-weight:900}
header p{margin:0;font-size:16px}
.cta{display:block;background:var(--accent);color:#fff;text-decoration:none;text-align:center;font-weight:700;font-size:18px;border-radius:12px;padding:16px;margin:24px 0}
.cta.sub{background:var(--blue)}
header .cta{max-width:360px;margin:20px auto 20px}
section{padding:32px 0 8px}
h2{font-size:22px;margin:0 0 12px;border-left:6px solid var(--blue);padding-left:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 56px;margin:10px 0;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:30px;font-weight:700}
ol.steps b{display:block}
dl{margin:0}dt{font-weight:700;margin-top:12px}dd{margin:0;color:var(--sub)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}th{width:6.5em;color:var(--sub);font-weight:600}
.note{color:var(--sub);font-size:14px}
footer{text-align:center;color:var(--sub);font-size:13px;padding:32px 16px 48px}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <img class="logo" src="img/logo.png" alt="石巻まちなかパン博覧会 パンパク">
  <h1>パン食い競争 出場申込</h1>
</header>
<main class="wrap">
<section>
  <div class="card" style="text-align:center">
    <p style="font-size:20px;font-weight:700;margin:8px 0">申込フォームは準備中です</p>
    <p class="note">公開までもう少しお待ちください。公開の際は、公式Instagram（<a href="https://www.instagram.com/ishinomaki_panpaku/" style="color:var(--blue);font-weight:700">@ishinomaki_panpaku</a>）などでお知らせします。</p>
  </div>
  <img class="chars" src="img/chars.png" alt="ショックパンくんとショックパンミちゃん">
  <a class="cta sub" href="index.html">パン食いダービーのページに戻る</a>
</section>
</main>
<footer>石巻まちなかパン博覧会 パンパク ／ パン食い競争 運営チーム</footer>
</body>
</html>
